name: Build & Release CatPay Mod

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatPay-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Processing release for tag: $TAG"
          gh release upload "$TAG" build/libs/*.jar --clobber || \
          gh release create "$TAG" build/libs/*.jar \
            --title "CatPay $TAG (Minecraft 1.21.11)" \
            --notes-file RELEASE_NOTES.md
